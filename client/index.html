<!DOCTYPE html>
<html lang="es">

      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 antialiased font-sans selection:bg-paypal-vibrant selection:text-white min-h-screen">
